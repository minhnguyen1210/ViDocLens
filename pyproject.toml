[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vidoclens"
version = "0.1.0"
description = "Vietnamese receipt understanding: research and serving foundation"
requires-python = ">=3.11,<3.15"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1"]

[project.optional-dependencies]
data = ["Pillow>=11.1,<13", "numpy>=2,<3"]
serve = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "Pillow>=11.1,<13"]
demo = ["gradio>=5,<7", "httpx>=0.28,<1"]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "PyYAML>=6,<7"]

[project.scripts]
vidoclens = "vidoclens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vidoclens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["artifacts", "cache", "data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
